<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock Vault &bull; SecureVault</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-brand">
                <h1>🛡️ SecureVault</h1>
                <p>Unlock your encrypted credential manager</p>
            </div>

            <div id="alertBox" class="alert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Account Email</label>
                    <input type="email" id="email" class="form-input" placeholder="alice@example.com" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Master Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="form-input" placeholder="Enter master password" required>
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('password', this)">👁️</button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: 10px;">
                    Unlock Vault
                </button>
            </form>

            <div class="auth-footer">
                New user? <a href="/register">Create a master vault</a>
            </div>
        </div>
    </div>

    <script src="/js/auth.js"></script>
    <script>
        // If already logged in, go straight to dashboard
        checkAuth(false);
    </script>
</body>
</html>
